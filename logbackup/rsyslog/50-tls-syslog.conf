# rsyslog TLS 接收配置
# 监听 TCP 8514 端口，接收交换机/防火墙的 TLS syslog

# 加载 TLS 模块
module(load="imtcp"
    StreamDriver.Name="gtls"
    StreamDriver.Mode="1"
    StreamDriver.AuthMode="anon"
)

# 全局 TLS 设置
global(
    DefaultNetstreamDriver="gtls"
    DefaultNetstreamDriverCAFile="/etc/rsyslog-certs/ca.crt"
    DefaultNetstreamDriverCertFile="/etc/rsyslog-certs/server.crt"
    DefaultNetstreamDriverKeyFile="/etc/rsyslog-certs/server.key"
)

# 输入配置 - 仅 TLS
input(type="imtcp"
    port="8514"
    name="tls-input"
    # 取消注释下面这行可要求客户端证书验证（mTLS）
    # StreamDriver.AuthMode="x509/name"
)

# 模板 - 按来源 IP 分文件存储
template(name="RemoteLog" type="string"
    string="/var/log/remote/%fromhost-ip%/%programname%.log"
)

# 模板 - 统一存储（带时间戳）
template(name="RemoteLogAll" type="string"
    string="/var/log/remote/all-remote.log"
)

# 规则 - 所有 8514 端口收到的日志都记录
# 按 IP 分类
:inputname, isequal, "tls-input" ?RemoteLog

# 统一副本
:inputname, isequal, "tls-input" ?RemoteLogAll
